[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/daemon",
    "crates/ssh",
    "crates/persistence",
    "crates/terminal",
    "crates/store",
    "crates/helper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
ts-rs = "10"
russh = "0.45"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }

protocol = { path = "crates/protocol" }
daemon = { path = "crates/daemon" }
ssh = { path = "crates/ssh" }
persistence = { path = "crates/persistence" }
terminal = { path = "crates/terminal" }
store = { path = "crates/store" }
